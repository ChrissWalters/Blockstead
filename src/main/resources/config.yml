# Blockstead configuration.
# Changes take effect after the next server restart.

# Language of the plugin's messages.
#   auto – every player gets the language of their Minecraft client (default)
#   <code> – a fixed language for everyone, e.g. de or en (the name of a file in lang/)
# Bundled: en, de. Own or changed texts: plugins/Blockstead/lang/<code>.yml (see the comments in the
# bundled files, or the documentation).
language: auto
# Language for the console and for client languages without a language file.
fallback-language: en

# LuckPerms prefixes/suffixes in chat, tab list and above the head (nametag).
# Only active if LuckPerms (5.5.85 or newer) is installed; otherwise the plugin runs without (warning in the log).
# Prefix/suffix come ready-made from LuckPerms (meta-formatting), colour codes there with & (e.g. &c).
display:
  # false = don't touch chat and tab list (e.g. if a chat plugin takes over later).
  enabled: true
  # Templates with MiniMessage formatting and the placeholders {prefix}, {name}, {suffix}, {message}.
  # The chat message ({message}) is always shown as plain text – colour codes in it have no effect.
  chat-format: "{prefix}{name}{suffix}: {message}"
  tab-format: "{prefix}{name}{suffix}"
  # Sort the tab list by the highest weight of the LuckPerms groups (highest first).
  sort-tab-by-weight: true
  # Show prefix/suffix above the head (nametag) as well.
  nametag: true

# Join message: shown to every person when they join the server (only to them).
# One line per entry; empty list = no message.
# MiniMessage formatting, e.g. <gold>, <bold>, <gray>…</gray>
# (overview: https://docs.papermc.io/adventure/minimessage/format).
# Addresses starting with http:// or https:// become clickable automatically (and stay visible).
# Clicks that run a command (<click:run_command:…>) are removed; <click:suggest_command:…> (only puts the
# command into the chat line) works.
# Note: Minecraft only opens http(s) links. For Teamspeak use an invite link,
# e.g. https://invite.teamspeak.com/ts.example.org – it opens Teamspeak.
# Example:
#   join-info:
#     - "<gold>Teamspeak:</gold> https://invite.teamspeak.com/ts.example.org"
#     - "<gold>Discord:</gold> https://discord.gg/example"
join-info: []

# Server message from the team with /announce <message> (e.g. before maintenance).
announce:
  # Prefix in the chat (MiniMessage); also used as the heading of the on-screen title.
  prefix: "<dark_red><bold>[Server]</bold></dark_red> "
  # Also show it big on the screen.
  title: true
  # Play a notification sound.
  sound: true

backups:
  # On every server start, data.db and the WorldGuard region files are copied to plugins/Blockstead/backups/
  # – before the plugin changes anything (important for plugin updates with data migrations).
  enabled: true
  # How many backups are kept; older ones are deleted at startup.
  keep: 10

economy:
  # Balances are kept by an economy plugin (e.g. EssentialsX), connected through Vault. The currency's
  # name/symbol and the starting balance of new players are set there (EssentialsX: currency-symbol,
  # starting-balance). Without an economy plugin, plots can't be bought; staff can still assign them.
  #
  # Transfer balances from Blockstead 1.x to the economy plugin once. The balance there is SET to the old
  # value (not added). Every account is transferred only once; the result is in the server log
  # ("Transfer finished: …"). false = discard the old balances.
  import-old-balances: true

plots:
  # Price for "/plot claim" – a whole number in the currency of the economy plugin. When a plot is given
  # back or deleted ("/plot unclaim", "/plot unassign", "/plot remove"), the person who paid gets the
  # amount back. 0 = free (works without an economy plugin, too).
  price: 100

  # Waiting time in minutes between two "/plot unclaim reset" by the same person (0 = none).
  # Restoring a plot is costly for the server; this prevents abuse. Staff are exempt.
  reset-cooldown-minutes: 10

  # WorldGuard priority of new plots. Must be higher than the priority of regions that overlap plots
  # (e.g. a city), so that the plot's flags apply.
  priority: 10

  # WorldGuard flags every new plot is created with.
  # Format: <flag name>: <value> – as in "/rg flag <ID> <flag name> <value>".
  # Use "allow" or "deny" for yes/no flags (not yes/no/true/false).
  # Existing plots are not changed.
  #
  # Careful: these flags apply to EVERYONE, including owners and members. Protection flags like use,
  # interact, chest-access or build therefore do NOT belong here – strangers can't do anything on a plot
  # anyway (WorldGuard membership), and what members may do is defined by the roles below.
  default-flags:
    # Fights and explosions
    pvp: deny
    tnt: deny
    creeper-explosion: deny
    other-explosion: deny
    # Fire and natural events
    fire-spread: deny
    lava-fire: deny
    lightning: deny
    water-flow: allow
    lava-flow: allow
    # Mobs
    enderman-grief: deny
    mob-damage: allow
    mob-spawning: allow
    entity-painting-destroy: deny
    entity-item-frame-destroy: deny

# Cities ("/city create <name>" from a WorldEdit selection, always from the bottom to the top of the world).
# Outside of plots, only the people added with "/city trust" may build in a city – this protects the city's own
# buildings, streets etc. On plots, only the plot counts: owners build as usual, city builders have no rights there.
# A plot belongs to a city if it shares at least one block column with it (the city with the largest shared
# area, if several). Plot price: own price of the plot ("/plot price") > price of the city ("/city price") >
# plots.price.
cities:
  # WorldGuard priority of new cities. Must be lower than plots.priority (otherwise plots.priority - 1 is used).
  priority: 0
  # WorldGuard flags every new city is created with (format as in plots.default-flags).
  # Careful: flags of a city also apply on every plot inside it that doesn't set the flag itself. Protection
  # flags (use, interact, chest-access, build …) are therefore ignored here – "allow" would open the plots to
  # strangers, "deny" would lock out their owners.
  default-flags:
    pvp: deny
    tnt: deny
    creeper-explosion: deny
    other-explosion: deny
    fire-spread: deny
    lava-fire: deny
    lightning: deny
    enderman-grief: deny
    entity-painting-destroy: deny
    entity-item-frame-destroy: deny

# Roles that owners can give on their plot ("/plot trust <name> <role>").
# The highest role "owner" is built in and may do everything, including giving roles and giving the plot
# back (the old key "besitzende" still works). Below it, as many roles as you like:
#   <key>:                  – used in the command; lowercase letters, digits, - and _ only
#     name: <display name>  – optional; without it the name comes translated from the language file
#                             (role.<key>), otherwise the key is shown
#     aliases: [<keys>]     – optional; further keys that also mean this role (in commands and stored data)
#     rights: [<rights>]
# Possible rights:
#   build        – build and break (also buckets, tools like hoe/axe, bone meal, editing signs)
#   containers   – chests, barrels, shulker boxes, hoppers, dispensers, lecterns etc.
#   doors        – doors, trapdoors, fence gates, buttons, levers, pressure plates, bells
#   workstations – crafting table, furnaces, anvils, enchanting table, brewing stand, beds, ender chest etc.
#   entities     – animals, villagers, armor stands, item frames (use and attack)
#   home         – "/plot home set" on this plot
# Members without a stored role (e.g. added with "/rg addmember") have all rights.
# The aliases are the German keys used up to Blockstead 2.0 – keep them so existing data stays valid.
roles:
  resident:
    aliases: [mitbewohnende]
    rights: [build, containers, doors, workstations, entities, home]
  builder:
    aliases: [bauhilfe]
    rights: [build, doors, workstations]
  guest:
    aliases: [gast]
    rights: [doors]
