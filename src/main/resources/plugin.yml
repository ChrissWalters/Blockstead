name: Blockstead
version: ${version}
main: com.github.chrisswalters.blockstead.Blockstead
description: CityBuild plots on WorldGuard/WorldEdit - claim, roles, homes, reset
authors: [ChrissWalters]
website: https://github.com/ChrissWalters/Blockstead
api-version: '26.3'
depend: [WorldEdit, WorldGuard]
# optional, werden vor Blockstead geladen, falls installiert:
#   LuckPerms – Präfixe in Chat/Tab-Liste/Nametag; Vault – Server-Währung (z.B. EssentialsX) zum Kaufen
softdepend: [LuckPerms, Vault]
# Befehle werden im Code registriert (Paper-Brigadier, siehe Blockstead.onEnable), hier nur die Rechte.
permissions:
  bs.plot:
    description: "able to use /plot or /p (help, info, list)"
    default: true
  bs.plot.claim:
    description: "able to buy a free plot with /plot claim"
    default: true
  bs.plot.unclaim:
    description: "able to release an own plot with /plot unclaim"
    default: true
  bs.plot.home:
    description: "able to use /plot home and /plot home set"
    default: true
  bs.plot.trust:
    description: "able to give/remove roles on own plots with /plot trust and /plot untrust"
    default: true
  bs.plot.trust.others:
    description: "able to use /plot trust and /plot untrust on any plot"
    default: op
  bs.plot.bypass:
    description: "not restricted by plot roles (WorldGuard bypass is separate)"
    default: op
  bs.plot.reset:
    description: "able to reset any plot to its snapshot with /plot reset (ownership stays)"
    default: op
  bs.plot.snapshot:
    description: "able to save the current state of a plot as reset snapshot with /plot snapshot"
    default: op
  bs.plot.tp:
    description: "able to teleport to any plot with /plot tp <ID> [world]"
    default: op
  bs.plot.list.others:
    description: "able to use /plot list <Name>"
    default: op
  bs.plot.list.all:
    description: "able to list all plots with /plot plots and /city plots"
    default: op
  bs.plot.free:
    description: "able to list free plots with /plot free and /city free"
    default: true
  bs.plot.price:
    description: "able to set the own price of a plot with /plot price"
    default: op
  bs.city:
    description: "able to use /city, /city list and /city info"
    default: true
  bs.city.manage:
    description: "able to create, redefine and remove cities and set their price, greeting and farewell"
    default: op
  bs.city.trust:
    description: "able to decide who may build in a city with /city trust and /city untrust"
    default: op
  bs.plot.assign:
    description: "able to assign a free plot for free with /plot assign"
    default: op
  bs.plot.unassign:
    description: "able to release any plot with /plot unassign"
    default: op
  bs.plot.create:
    description: "able to use /plot create"
    default: op
  bs.plot.remove:
    description: "able to use /plot remove <ID>"
    default: op


  bs.announce:
    description: "able to send a highlighted server message to everyone with /announce"
    default: op
