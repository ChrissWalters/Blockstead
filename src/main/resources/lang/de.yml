# Blockstead – deutsche Texte
#
# Format: ein Text pro Schlüssel, MiniMessage-Formatierung (https://docs.papermc.io/adventure/minimessage/format),
# z.B. <gold>, <bold>, <red>…</red>. Tags wie <id> oder <name> sind Platzhalter, die das Plugin füllt – genau so
# stehen lassen. Klicks, die einen Befehl ausführen (<click:run_command:…>), werden entfernt.
#
# Eigene Änderungen: diese Datei nicht in der Jar ändern, sondern eine Datei mit gleichem Namen nach
# plugins/Blockstead/lang/ legen, die nur die geänderten Schlüssel enthält – alles andere kommt aus der
# mitgelieferten Datei. Eine neue Datei (z.B. fr.yml als Kopie dieser Datei) ergänzt eine neue Sprache.


