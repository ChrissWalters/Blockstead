# Blockstead – English texts
#
# Format: one text per key, MiniMessage formatting (https://docs.papermc.io/adventure/minimessage/format),
# e.g. <gold>, <bold>, <red>…</red>. Tags like <id> or <name> are placeholders filled in by the plugin – keep
# them exactly as they are. Clicks that run a command (<click:run_command:…>) are removed.
#
# Your own changes: don't edit this file inside the jar. Put a file with the same name into
# plugins/Blockstead/lang/ that contains only the keys you want to change – everything else comes from the
# bundled file. A new file (e.g. fr.yml, a copy of this one) adds a new language.


