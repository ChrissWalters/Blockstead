plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
}

group = 'com.github.chrisswalters'
version = '2.2.0'

// Paper version the plugin is compiled against and that `./gradlew runServer` starts
def mcVersion = '26.3'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        // VaultAPI gibt es nur über JitPack; auf diese Gruppe beschränkt
        name = 'jitpack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.MilkBowl' }
    }
}

dependencies {
    // All provided by the server at runtime -> compileOnly, nothing gets bundled into the jar
    compileOnly 'io.papermc.paper:paper-api:26.3.build.200-stable'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.4.6'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.19'
    compileOnly 'net.luckperms:api:5.5'
    // transitive = false: VaultAPI zieht sonst eine alte Bukkit-API mit, die mit der Paper-API kollidiert
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }
}

def targetJavaVersion = 25
java {
    // Gradle uses an installed JDK 25 or downloads one; also used by runServer
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Local test server: `./gradlew runServer` (server files live in ./run)
tasks.named('runServer') {
    minecraftVersion(mcVersion)
    downloadPlugins {
        // version number is shared with the Fabric build on Modrinth, so use the Bukkit jar directly
        url('https://cdn.modrinth.com/data/1u6JkXh5/versions/YFnqiUlL/worldedit-bukkit-7.4.6.jar')
        modrinth('worldguard', '7.0.19')
        url('https://download.luckperms.net/1674/bukkit/loader/LuckPerms-Bukkit-5.5.87.jar')
        url('https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar')
        // EssentialsX gibt es für 26.3 nur als Dev-Build ohne feste Download-Adresse:
        // EssentialsX-*.jar (und EssentialsXSpawn-*.jar) bei Bedarf von Hand nach run/plugins/ legen
    }
}

// Alle Sprachdateien müssen dieselben Schlüssel und Platzhalter haben wie en.yml (läuft bei ./gradlew build).
// Platzhalter = kleingeschriebene Tags wie <id>, ohne die Formatierungs-Tags von MiniMessage.
def checkLanguageFiles = tasks.register('checkLanguageFiles') {
    def langDir = file('src/main/resources/lang')
    inputs.dir(langDir)
    doLast {
        def styleTags = ['black', 'dark_blue', 'dark_green', 'dark_aqua', 'dark_red', 'dark_purple', 'gold', 'gray',
                         'grey', 'dark_gray', 'dark_grey', 'blue', 'green', 'aqua', 'red', 'light_purple', 'yellow',
                         'white', 'bold', 'b', 'italic', 'i', 'em', 'underlined', 'u', 'strikethrough', 'st',
                         'obfuscated', 'obf', 'reset', 'newline', 'br', 'rainbow', 'gradient', 'transition', 'pride'] as Set
        def parse = { File f ->
            def texts = [:]
            f.eachLine('UTF-8') { line ->
                def m = line =~ /^([a-z0-9_.-]+):\s*"(.*)"\s*$/
                if (m.matches()) {
                    texts[m.group(1)] = m.group(2)
                }
            }
            texts
        }
        def placeholders = { String text ->
            (text =~ /<([a-z_]+)>/).collect { it[1] }.findAll { !styleTags.contains(it) } as Set
        }
        def reference = parse(new File(langDir, 'en.yml'))
        def errors = []
        langDir.listFiles().findAll { it.name.endsWith('.yml') && it.name != 'en.yml' }.sort().each { f ->
            def other = parse(f)
            (reference.keySet() - other.keySet()).each { errors << "${f.name}: missing key ${it}" }
            (other.keySet() - reference.keySet()).each { errors << "${f.name}: unknown key ${it}" }
            reference.each { key, text ->
                if (other.containsKey(key) && placeholders(text) != placeholders(other[key])) {
                    errors << "${f.name}: placeholders of ${key} differ – en: ${placeholders(text)}, ${f.name}: ${placeholders(other[key])}"
                }
            }
        }
        if (!errors.isEmpty()) {
            throw new GradleException("Language files are not consistent:\n  " + errors.join("\n  "))
        }
    }
}
tasks.named('check') { dependsOn checkLanguageFiles }
