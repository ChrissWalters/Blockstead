name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Standard: nur lesen. Schreibrecht bekommt allein der Release-Job (nur bei Tags v*).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: blockstead-plugin
          path: build/libs/*.jar

  # Pushing a tag like v2.0.1 attaches the jar from the build job to a GitHub release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release anlegen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: blockstead-plugin
          path: dist

      # Release-Text = Abschnitt "## <Version>" aus CHANGELOG.md (Tag v2.0.1 -> "## 2.0.1")
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Kein Abschnitt '## $version' in CHANGELOG.md"; exit 1; }

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar
          body_path: release-notes.md
