name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: blockstead-plugin
          path: build/libs/*.jar

      # Release-Text = Abschnitt "## <Version>" aus CHANGELOG.md (Tag v1.0.1 -> "## 1.0.1")
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Kein Abschnitt '## $version' in CHANGELOG.md"; exit 1; }

      # pushing a tag like v1.0.1 attaches the jar to a GitHub release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          body_path: release-notes.md
